<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>8mellow — Set New Password</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --purple:#5B32A5; --light-purple:#F3ECFC; --mint:#7FFFD4; --dark-gold:#B8860B; --ink:#1A1A1A; --muted:#666666; --line:#EAEAEA; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background: radial-gradient(circle at 50% 20%, #F9F5FF 0%, transparent 40%), radial-gradient(circle at 10% 80%, #FFF5F5 0%, transparent 40%), #FAF7F2; color:var(--ink); font-family:'Inter', sans-serif; line-height:1.6; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .container { width: 100%; max-width: 480px; background: white; border-radius: 24px; padding: 48px; box-shadow: 0 20px 60px rgba(91,50,165,0.08); position: relative; overflow: hidden; }
  .container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, var(--purple), var(--mint)); }
  .logo { font-family:'Outfit',sans-serif; font-size:32px; font-weight:700; color:var(--dark-gold); padding-bottom: 2px; border-bottom: 4px solid var(--mint); display: inline-block; margin-bottom: 32px; }
  h1 { font-family: 'Outfit', sans-serif; font-size: 28px; color: var(--purple); margin-bottom: 8px; font-weight: 700; }
  .subtitle { color: var(--muted); font-size: 15px; margin-bottom: 32px; }
  .form-group { margin-bottom: 20px; }
  label { display: block; font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
  input { width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; font-size: 15px; background: #FAFAFA; transition: all 0.2s; }
  input:focus { outline: none; border-color: var(--purple); background: white; box-shadow: 0 0 0 3px var(--light-purple); }
  .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; background: var(--purple); color: white; font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
  .btn:hover { background: #482680; transform: translateY(-1px); }
</style>
</head>
<body>

<div class="container">
  <div class="logo">8mellow</div>
  <h1>Set new password</h1>
  <p class="subtitle">Please enter your new password below.</p>

  <form id="reset-form">
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="new-password" placeholder="Enter new password" required minlength="6">
    </div>
    <button type="submit" class="btn">Update Password</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = 'https://gwirenkzjelndztpgjfk.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3aXJlbmt6amVsbmR6dHBnamZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0OTk3MjMsImV4cCI6MjExMDA3NTcyM30.ijyo2hp4TWgh_QW0wft4FHZwfxk4XQgAANYZgBOUds4'; // <-- MAKE SURE KEY IS HERE
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPassword = document.getElementById('new-password').value;

    // Supabase automatically detects the reset token in the URL and logs the user in temporarily
    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

    if (error) {
      alert('Error updating password: ' + error.message);
    } else {
      alert('Password updated successfully! You can now log in.');
      window.location.href = 'auth.html?mode=login';
    }
  });
</script>

</body>
</html>
