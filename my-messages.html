<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>8mellow — My Messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#5B32A5;
    --purple-hover:#482680;
    --light-purple:#F3ECFC;
    --mint:#7FFFD4; 
    --dark-gold:#B8860B; 
    --ink:#1A1A1A;
    --muted:#666666;
    --line:#EAEAEA;
    --danger: #C97064;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  
  body{
    background: radial-gradient(circle at 20% 10%, #FFF5F5 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, #FFF9F0 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #F9F5FF 0%, transparent 60%), #FAF7F2;
    color:var(--ink); font-family:'Inter', sans-serif; line-height:1.6;
    -webkit-font-smoothing:antialiased; background-attachment: fixed; min-height: 100vh; padding: 40px 20px;
  }
  
  .messages-container {
    width: 100%; max-width: 800px; margin: 0 auto; background: white;
    border-radius: 24px; padding: 48px; box-shadow: 0 20px 60px rgba(91,50,165,0.06);
    border: 1px solid rgba(255,255,255,0.8); position: relative; overflow: hidden;
  }
  .messages-container::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, var(--purple), var(--mint));
  }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
  .logo {
    font-family:'Outfit',sans-serif; font-size: 24px; font-weight:700; color:var(--dark-gold); 
    letter-spacing: -0.03em; padding-bottom: 2px; border-bottom: 4px solid var(--mint); display: inline-block;
  }
  
  .nav-links { display: flex; gap: 16px; }
  .nav-links a {
    color: var(--muted); text-decoration: none; font-size: 15px; font-weight: 500; transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--purple); }

  h1 { font-family: 'Outfit', sans-serif; font-size: 32px; color: var(--purple); margin-bottom: 32px; font-weight: 700; }

  /* Message Cards */
  .message-card { border: 1px solid var(--line); border-radius: 20px; padding: 24px; background: #FAFAFA; margin-bottom: 20px; transition: all 0.2s; }
  .message-card:hover { border-color: var(--purple); background: white; box-shadow: 0 10px 30px rgba(91,50,165,0.05); }
  
  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .card-meta { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
  .category-badge { background: var(--light-purple); color: var(--purple); padding: 4px 12px; border-radius: 999px; font-weight: 600; font-size: 12px; }
  
  .status-badge { padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; text-transform: capitalize;}
  .status-public { background: #E8F5E9; color: #2E7D32; }
  .status-hidden { background: #FFF3E0; color: #E65100; }

  .card-text { font-size: 16px; line-height: 1.6; color: var(--ink); margin-bottom: 20px; }

  .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 16px; }
  .card-stats { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
  
  .card-actions { display: flex; gap: 8px; }
  .action-btn {
    background: white; border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px;
    font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; transition: all 0.2s;
  }
  .action-btn:hover { border-color: var(--purple); color: var(--purple); }
  .action-btn.danger:hover { border-color: var(--danger); color: var(--danger); background: #FFF5F5;}
  
  /* Empty states */
  .empty-card{ text-align:center; padding:48px 20px; }
  .empty-card svg{ width:170px; height:auto; margin-bottom:20px; animation:floaty 5s ease-in-out infinite; }
  .empty-card.small{ padding:32px 20px; }
  .empty-card.small svg{ width:120px; }
  .empty-card h3{ font-family:'Outfit',sans-serif; font-size:22px; color:var(--purple); margin-bottom:8px; }
  .empty-card p{ color:var(--muted); font-size:15px; max-width:340px; margin:0 auto 24px; }
  .empty-btn{ display:inline-block; background:var(--purple); color:white; border:none; padding:14px 28px; border-radius:999px; font-family:'Outfit',sans-serif; font-size:15px; font-weight:600; text-decoration:none; cursor:pointer; transition:all .2s; }
  .empty-btn:hover{ background:#482680; transform:translateY(-1px); }
  @keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  @media (prefers-reduced-motion: reduce){ .empty-card svg{ animation:none; } }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }

  @media(max-width: 600px) {
    .messages-container { padding: 32px 24px; }
    
    /* Fix the header layout */
    .header {
      flex-direction: column; /* Stacks logo on top, links below */
      align-items: flex-start;
      gap: 16px;
    }
    .nav-links {
      width: 100%;
      justify-content: flex-end; /* Pushes Dashboard and New Message to the right */
      gap: 20px; /* Adds a bit of space between them */
    }
    
    .card-footer { flex-direction: column; align-items: flex-start; gap: 16px; }
    .card-actions { width: 100%; justify-content: flex-end; }
  } 
</style>
</head>
<body>

<div class="messages-container">
  
  <div class="header">
    <div class="logo">8mellow</div>
    <div class="nav-links">
      <a href="dashboard.html">← Dashboard</a>
      <a href="write.html">+ New Message</a>
    </div>
  </div>

  <h1>My Messages</h1>

  <!-- Container where messages will load -->
  <div id="messages-list">
    <p style="text-align:center; color:var(--muted);">Loading your messages...</p>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = 'https://gwirenkzjelndztpgjfk.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3aXJlbmt6amVsbmR6dHBnamZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0OTk3MjMsImV4cCI6MjExMDA3NTcyM30.ijyo2hp4TWgh_QW0wft4FHZwfxk4XQgAANYZgBOUds4'; // <-- MAKE SURE YOUR KEY IS HERE
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  // Makes text safe to place inside HTML (stops pasted code from running)
  function esc(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  let currentUser = null;

  async function loadMyMessages() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    
    if (!user) {
      window.location.href = 'auth.html?mode=login';
      return;
    }
    currentUser = user;

    const container = document.getElementById('messages-list');

    // Fetch ONLY posts where user_id matches the logged-in user
     const { data: posts, error } = await supabaseClient
   .from('posts')
   .select(`
     *,
     threads ( id )
   `)
   .eq('user_id', user.id)
   .order('created_at', { ascending: false });

    if (error) {
      container.innerHTML = '<p>Error loading messages.</p>';
      return;
    }

    if (posts.length === 0) {
      const ART_QUILL = `<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="100" cy="148" rx="50" ry="5" fill="#5B32A5" opacity=".08"/><rect x="48" y="22" width="92" height="112" rx="10" fill="white" stroke="#5B32A5" stroke-width="3"/><path d="M64 50h60M64 68h60M64 86h34" stroke="#5B32A5" stroke-width="3" stroke-linecap="round" opacity=".2"/><path d="M170 30C142 40 120 70 110 108C140 100 166 74 170 30Z" fill="#7FFFD4" stroke="#5B32A5" stroke-width="3" stroke-linejoin="round"/><path d="M170 30L102 122" stroke="#5B32A5" stroke-width="3" stroke-linecap="round"/><circle cx="101" cy="124" r="3.5" fill="#B8860B"/><circle cx="24" cy="44" r="4" fill="#7FFFD4"/><path d="M26 112v10M21 117h10" stroke="#B8860B" stroke-width="2.5" stroke-linecap="round"/></svg>`;
      container.innerHTML = `<div class="empty-card">${ART_QUILL}<h3>You haven't shared anything yet</h3><p>Take your time. When you post a message, it will appear here.</p><a class="empty-btn" href="write.html">Write a message</a></div>`;
      return;
    }

    // Count the "Me too" presses for each of my posts
    const { data: likes } = await supabaseClient
      .from('post_likes')
      .select('post_id')
      .in('post_id', posts.map(p => p.id));

    const likeCounts = {};
    (likes || []).forEach(l => {
      likeCounts[l.post_id] = (likeCounts[l.post_id] || 0) + 1;
    });

    // Render the messages
    container.innerHTML = posts.map(post => `
      <div class="message-card" id="post-${post.id}">
        <div class="card-top">
          <div class="card-meta">
            <span class="category-badge">${esc(post.category)}</span>
            <span>${timeAgo(post.created_at)}</span>
          </div>
          <span class="status-badge status-${post.status || 'public'}">${post.status || 'public'}</span>
        </div>
        
        <p class="card-text">${esc(post.content)}</p>

        <div class="card-footer">
                 <div class="card-stats">
         <div>♥ ${likeCounts[post.id] || 0} me too</div>
         <div>💬 ${post.threads ? post.threads.length : 0} ${post.threads && post.threads.length === 1 ? 'reply' : 'replies'}</div>
       </div>
          <div class="card-actions">
            <button onclick="toggleStatus('${post.id}', '${post.status || 'public'}')" class="action-btn">
              ${post.status === 'hidden' ? 'Make Public' : 'Hide'}
            </button>
            <button onclick="deleteMessage('${post.id}')" class="action-btn danger">Delete</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  // Function to Hide/Show a post
  async function toggleStatus(postId, currentStatus) {
    const newStatus = currentStatus === 'hidden' ? 'public' : 'hidden';
    
    const { error } = await supabaseClient
      .from('posts')
      .update({ status: newStatus })
      .eq('id', postId)
      .eq('user_id', currentUser.id);

    if (error) {
      alert('Error updating status: ' + error.message);
    } else {
      loadMyMessages(); // Reload the list
    }
  }

  // Function to Delete a post
  async function deleteMessage(postId) {
    if (!confirm('Delete this message?\n\nIt will be removed from the wall for good. Any private chats started from it will stay in your inbox until you delete them.')) return;

    const { error } = await supabaseClient
      .from('posts')
      .delete()
      .eq('id', postId)
      .eq('user_id', currentUser.id);

    if (error) {
      alert('Error deleting message: ' + error.message);
    } else {
      // Remove the card from the screen immediately
      document.getElementById(`post-${postId}`).remove();
    }
  }

  // Run on page load
  function timeAgo(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const diffMs = now - date;
    
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);

    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return `${diffMins} min${diffMins > 1 ? 's' : ''} ago`;
    if (diffHours < 24) return `${diffHours} hr${diffHours > 1 ? 's' : ''} ago`;
    if (diffDays < 7) return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;

    // Older than 7 days
    return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }  
loadMyMessages();
</script>

<script src="idle-timeout.js"></script>
</body>
</html>
