<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>8mellow</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#5B32A5">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{ --purple:#5B32A5; --light-purple:#F3EDFB; --mint:#7FFFD4; --dark-gold:#B8860B; --ink:#1F1B2E; --muted:#6B6B6B; --line:#E8E2F0; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{ font-family:'Inter',sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased;
    background: radial-gradient(circle at 15% 10%, #FFF5F5 0%, transparent 40%), radial-gradient(circle at 85% 90%, #F3EDFB 0%, transparent 45%), #FAF7F2; }

  .shell{ display:grid; grid-template-columns:260px minmax(0,1fr); height:100vh; height:100dvh; }

  /* ---- side menu ---- */
  .side{ display:flex; flex-direction:column; padding:22px 16px; gap:6px; background:rgba(255,255,255,.7); border-right:1px solid var(--line); overflow-y:auto; }
  .brand{ display:flex; align-items:center; justify-content:space-between; margin:0 6px 18px; }
  .logo{ font-family:'Outfit',sans-serif; font-size:26px; font-weight:700; color:var(--dark-gold); padding-bottom:2px; border-bottom:4px solid var(--purple); text-decoration:none; }
  .item{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px; text-decoration:none; color:var(--ink); font-weight:600; font-size:15px; line-height:1.3; border:1px solid transparent; position:relative; }
  .item:hover{ background:#fff; color:var(--purple); border-color:#E1D5F5; }
  .item.active{ background:#fff; color:var(--purple); border-color:#CBB6EE; box-shadow:0 2px 10px rgba(91,50,165,.10); }
  .ico{ width:40px; height:40px; border-radius:12px; background:#F3EDFB; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; }
  .item{ --edge:#F3EDFB; }
  .item:hover, .item.active{ --edge:#fff; }
  .item .short{ display:none; }
  .badge{ margin-left:auto; min-width:20px; padding:0 7px; border-radius:999px; background:var(--purple); color:#fff; font-size:12px; font-weight:600; line-height:20px; text-align:center; display:none; }
  .spacer{ flex:1; }

  .acct{ position:relative; }
  .acct-btn{ width:100%; display:flex; align-items:center; gap:10px; padding:12px 14px; border:none; border-radius:14px; background:var(--light-purple); color:var(--purple); font-family:inherit; font-weight:600; font-size:14px; cursor:pointer; }
  .acct-btn:hover{ background:#E8DEF7; }
  .menu{ display:none; position:absolute; left:0; right:0; bottom:calc(100% + 8px); background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 12px 32px rgba(91,50,165,.14); padding:6px; z-index:50; }
  .menu.show{ display:block; }
  .menu a, .menu button{ display:flex; width:100%; align-items:center; gap:10px; padding:11px 14px; border:none; background:none; border-radius:10px; font-family:inherit; font-size:14px; font-weight:500; color:var(--ink); text-decoration:none; cursor:pointer; text-align:left; }
  .menu a:hover, .menu button:hover{ background:var(--light-purple); }
  .menu hr{ border:none; border-top:1px solid var(--line); margin:6px 4px; }
  .menu .out{ color:#B3402F; }

  /* ---- content ---- */
  .view{ position:relative; min-width:0; height:100%; }
  iframe{ width:100%; height:100%; border:0; display:block; background:transparent; }
  .veil{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; background:transparent; pointer-events:none; opacity:0; transition:opacity .15s; }
  .veil.on{ opacity:1; }

  /* ---- phone: menu becomes a bottom bar ---- */
  .topbar{ display:none; }
  @media (max-width: 860px){
    .shell{ display:block; }
    .view{ position:fixed; left:0; right:0; top:52px; bottom:calc(64px + env(safe-area-inset-bottom)); height:auto; }
    .topbar{ display:flex; position:fixed; z-index:600; top:0; left:0; right:0; height:52px; align-items:center; justify-content:space-between; padding:0 16px; background:rgba(255,255,255,.96); border-bottom:1px solid var(--line); }
    .topbar .logo{ font-size:22px; }
    .topbar .acct-btn{ width:auto; padding:8px 14px; }
    .topbar .menu{ left:auto; right:0; bottom:auto; top:calc(100% + 8px); min-width:200px; }
    .side{ position:fixed; z-index:500; left:0; right:0; bottom:0; flex-direction:row; justify-content:space-around; gap:0; padding:6px 2px calc(6px + env(safe-area-inset-bottom)); height:auto; border-right:none; border-top:1px solid var(--line); background:rgba(255,255,255,.97); overflow:visible; box-shadow:0 -6px 20px rgba(91,50,165,.08); }
    .side .brand, .side .spacer, .side .acct{ display:none; }
    .item{ flex:1; flex-direction:column; gap:2px; padding:6px 1px; font-size:10.5px; text-align:center; border-radius:10px; }
    .ico{ width:auto; height:auto; background:none; }
    .item{ --edge:#fff; }
    .item .long{ display:none; } .item .short{ display:inline; }
    .badge{ position:absolute; top:0; right:calc(50% - 24px); margin:0; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="logo" href="#dashboard.html">8mellow</a>
  <div class="acct">
    <button type="button" class="acct-btn" data-acct aria-haspopup="true">👤 Account ▾</button>
    <div class="menu" role="menu">
      <a href="#profile.html">👤 My Profile</a>
      <a href="#settings.html">⚙️ Settings</a>
      <hr>
      <button type="button" class="out" data-signout>↩ Sign Out</button>
    </div>
  </div>
</div>

<div class="shell">
  <nav class="side" aria-label="Main menu">
    <div class="brand"><a class="logo" href="#dashboard.html">8mellow</a></div>
    <a class="item" data-page="dashboard.html" href="#dashboard.html"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#5B32A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12H3l9-9 9 9h-2"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/><path d="M9 21v-6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6"/></svg></span><span>Home</span></a>
    <a class="item" data-page="write.html" href="#write.html"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#5B32A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L18.5 9.5a2.83 2.83 0 0 0-4-4L4 16v4"/><path d="M13.5 6.5l4 4"/></svg></span><span class="label"><span class="long">Write a message</span><span class="short">Write</span></span></a>
    <a class="item" data-page="inbox.html" href="#inbox.html"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#5B32A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span><span>Inbox</span><span class="badge" id="inbox-badge"></span></a>
    <a class="item" data-page="my-messages.html" href="#my-messages.html"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#5B32A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg></span><span class="label"><span class="long">My messages</span><span class="short">My posts</span></span></a>
    <a class="item" data-page="dashboard.html#linked" href="#dashboard.html#linked"><span class="ico"><svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true"><ellipse cx="25" cy="23.5" rx="19" ry="14.5" fill="#D9A21B"/><path d="M13 32Q11 40 6.5 43.5Q17 43 23 37Z" fill="#D9A21B"/><ellipse cx="40" cy="38" rx="19" ry="14.5" fill="#7FE8C8" style="stroke:var(--edge);stroke-width:3"/><path d="M52 46.5Q54 54 58.5 57.5Q48 57 42 51Z" fill="#7FE8C8"/><circle cx="14" cy="21.5" r="2.4" fill="#5B32A5"/><circle cx="21" cy="21.5" r="2.4" fill="#5B32A5"/><circle cx="28" cy="21.5" r="2.4" fill="#5B32A5"/><circle cx="33" cy="38.5" r="2.4" fill="#5B32A5"/><circle cx="40" cy="38.5" r="2.4" fill="#5B32A5"/><circle cx="47" cy="38.5" r="2.4" fill="#5B32A5"/></svg></span><span class="label"><span class="long">Messages that might link to you</span><span class="short">For you</span></span></a>
    <a class="item" data-page="index.html" href="#index.html"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v3.2H3V6a2 2 0 0 1 2-2z" fill="#4A8C7E"/><path d="M3 10.6h8.2V20H5a2 2 0 0 1-2-2z" fill="#4A8C7E"/><path d="M12.8 10.6H21V18a2 2 0 0 1-2 2h-6.2z" fill="#4A8C7E"/></svg></span><span class="label"><span class="long">Explore the wall</span><span class="short">Wall</span></span></a>
    <div class="spacer"></div>
    <div class="acct">
      <button type="button" class="acct-btn" data-acct aria-haspopup="true">👤 Account ▾</button>
      <div class="menu" role="menu">
        <a href="#profile.html">👤 My Profile</a>
        <a href="#settings.html">⚙️ Settings</a>
        <hr>
        <button type="button" class="out" data-signout>↩ Sign Out</button>
      </div>
    </div>
  </nav>

  <main class="view">
    <iframe id="view" title="8mellow" src="about:blank"></iframe>
    <div class="veil" id="veil">Loading…</div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = 'https://gwirenkzjelndztpgjfk.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3aXJlbmt6amVsbmR6dHBnamZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0OTk3MjMsImV4cCI6MjExMDA3NTcyM30.ijyo2hp4TWgh_QW0wft4FHZwfxk4XQgAANYZgBOUds4';
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  const frame = document.getElementById('view');
  const veil = document.getElementById('veil');
  const ALLOWED = /^(dashboard|inbox|write|my-messages|chat|profile|settings|index)\.html(\?[A-Za-z0-9_=&%.\-]*)?(#[A-Za-z0-9_\-]*)?$/;

  // Hide each page's own logo / back links, and (for the wall) the landing-page parts
  const EMBED_CSS = [
    '.header, .top-header, .back-btn, .cancel-btn, .nav, .hero-section, .how-it-works, .explainer, .site-footer, .thought-card, .menu-column, .explore-btn { display:none !important; }',
    '.header-area { justify-content:flex-start !important; }',
    '.dashboard-grid { grid-template-columns:1fr !important; }',
    'body { min-height:0 !important; }',
    '.feed-section { padding-top:24px !important; }',
    '.dashboard-container, .inbox-container, .messages-container, .write-container, .container { margin-top:0 !important; }',
    'html { scroll-behavior:smooth; }'
  ].join('\n');

  function currentTarget() {
    let h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (!ALLOWED.test(h)) {
      h = 'dashboard.html';
      // coming back from an email link that was opened from a message's "reply" button
      const rp = new URLSearchParams(location.search).get('reply_to');
      if (rp && /^[A-Za-z0-9_\-]+$/.test(rp)) h += '?reply_to=' + rp;
    }
    return h;
  }

  function go(target) {
    veil.classList.add('on');
    frame.style.opacity = '0.0';
    frame.src = target;
    markActive(target);
  }

  function markActive(t) {
    const path = t.split('?')[0].split('#')[0];
    const hash = t.indexOf('#') > -1 ? t.slice(t.indexOf('#')) : '';
    let chosen = null;
    document.querySelectorAll('.item').forEach(a => {
      const p = a.getAttribute('data-page');
      a.classList.remove('active');
      if (p === 'dashboard.html#linked' && path === 'dashboard.html' && hash === '#linked') chosen = a;
    });
    if (!chosen) {
      let pg = path;
      if (pg === 'chat.html') pg = 'inbox.html';
      document.querySelectorAll('.item').forEach(a => { if (!chosen && a.getAttribute('data-page') === pg) chosen = a; });
    }
    if (chosen) chosen.classList.add('active');
  }

  // Style each page inside the frame as soon as it is ready
  setInterval(function () {
    try {
      const d = frame.contentDocument;
      if (!d || !d.head || d.location.href === 'about:blank') return;
      const file = d.location.pathname.split('/').pop();
      if (file === 'auth.html' || file === 'check-email.html' || file === '') {   // signed out / expired: leave the shell
        window.location.replace(d.location.href); return;
      }
      if (!d.getElementById('shell-embed-css') && d.body) {
        const st = d.createElement('style'); st.id = 'shell-embed-css'; st.textContent = EMBED_CSS;
        d.head.appendChild(st);
        // keep the address bar and the active item in step with the page
        const t = file + d.location.search + d.location.hash;
        try { history.replaceState(null, '', '#' + t); } catch (e) {}
        markActive(t);
        frame.style.opacity = '1'; veil.classList.remove('on');
      }
    } catch (e) { /* page still loading */ }
  }, 40);

  // After the page has styled itself, any link that leaves the app goes to the top window
  frame.addEventListener('load', function () {
    frame.style.opacity = '1'; veil.classList.remove('on');
    try {
      const d = frame.contentDocument;
      d.addEventListener('click', function (e) {
        const a = e.target.closest && e.target.closest('a[href]');
        if (!a) return;
        const href = a.getAttribute('href');
        if (/^(https?:)?\/\//.test(href) || /^mailto:/.test(href)) { a.target = '_top'; }
        else if (/^(faq|privacy|terms|guidelines|safety)\.html/.test(href)) { a.target = '_top'; }
      }, true);
    } catch (e) {}
  });

  window.addEventListener('hashchange', function () {
    const t = currentTarget();
    let cur = '';
    try { cur = frame.contentDocument.location.pathname.split('/').pop() + frame.contentDocument.location.search + frame.contentDocument.location.hash; } catch (e) {}
    if (t !== cur) go(t);
  });

  // ---- account menu ----
  document.querySelectorAll('[data-acct]').forEach(b => b.addEventListener('click', function (e) {
    e.stopPropagation();
    const m = b.parentElement.querySelector('.menu'); const open = m.classList.contains('show');
    document.querySelectorAll('.menu').forEach(x => x.classList.remove('show'));
    if (!open) m.classList.add('show');
  }));
  document.addEventListener('click', () => document.querySelectorAll('.menu').forEach(x => x.classList.remove('show')));
  document.querySelectorAll('.menu a').forEach(a => a.addEventListener('click', () => document.querySelectorAll('.menu').forEach(x => x.classList.remove('show'))));
  document.querySelectorAll('[data-signout]').forEach(b => b.addEventListener('click', async function () {
    try { localStorage.removeItem('8mellow_draft'); } catch (e) {}
    try { await supabaseClient.auth.signOut(); } catch (e) {}
    window.location.href = 'index.html';
  }));

  // ---- unread badge on Inbox ----
  async function refreshInboxBadge(user) {
    try {
      const { data: blocks } = await supabaseClient.from('blocks').select('blocked_id').eq('blocker_id', user.id);
      const blocked = (blocks || []).map(b => b.blocked_id);
      const { data: threads } = await supabaseClient.from('threads')
        .select('author_id, replier_id, unread_author, unread_replier, deleted_by_author, deleted_by_replier')
        .or(`author_id.eq.${user.id},replier_id.eq.${user.id}`);
      const unread = (threads || []).filter(t => {
        const mineAsAuthor = t.author_id === user.id;
        const other = mineAsAuthor ? t.replier_id : t.author_id;
        if (blocked.includes(other)) return false;
        return mineAsAuthor ? (t.unread_author && !t.deleted_by_author) : (t.unread_replier && !t.deleted_by_replier);
      }).length;
      const badge = document.getElementById('inbox-badge');
      if (unread > 0) { badge.textContent = unread; badge.style.display = 'inline-block'; }
      else { badge.style.display = 'none'; }
    } catch (e) {}
  }
  function watchInboxBadge(user) {
    let t = null;
    const fire = () => { clearTimeout(t); t = setTimeout(() => refreshInboxBadge(user), 400); };
    try {
      supabaseClient.channel('shell-inbox-' + user.id)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'threads', filter: 'author_id=eq.' + user.id }, fire)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'threads', filter: 'replier_id=eq.' + user.id }, fire)
        .subscribe();
    } catch (e) {}
    setInterval(() => { if (!document.hidden) refreshInboxBadge(user); }, 45000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshInboxBadge(user); });
  }

  // ---- start ----
  (async function () {
    let session = null;
    try { const r = await supabaseClient.auth.getSession(); session = r.data && r.data.session; } catch (e) {}
    if (!session) {
      const t = currentTarget();
      window.location.replace('auth.html?mode=login&next=' + encodeURIComponent(t.indexOf('#') > -1 ? t.split('#')[0] : t));
      return;
    }
    go(currentTarget());
    refreshInboxBadge(session.user);
    watchInboxBadge(session.user);
  })();
</script>
</body>
</html>
