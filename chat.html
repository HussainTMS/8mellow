<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>8mellow — Private Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ 
    --purple:#5B32A5; --purple-hover:#482680; --light-purple:#F3ECFC; 
    --surface-alt:#F2EDF7; --ink:#1A1A1A; --muted:#666666; --line:#EAEAEA; --danger:#C97064;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background: var(--surface-alt); color:var(--ink); font-family:'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  .chat-header { background: rgba(255,255,255,0.9); border-bottom: 1px solid var(--line); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .back-btn { color: var(--muted); text-decoration: none; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; transition: background 0.2s; }
  .back-btn:hover { background: var(--light-purple); color: var(--purple); }
  .back-btn svg { width: 20px; height: 20px; }
  .header-info h2 { font-family: 'Outfit', sans-serif; font-size: 18px; color: var(--purple); font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .header-info p { font-size: 12px; color: var(--muted); }

  .options-btn { background: var(--light-purple); border: none; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; color: var(--purple); cursor: pointer; padding: 8px 14px; border-radius: 999px; transition: all 0.2s; }
  .options-btn:hover { background: #E5D9F5; }

  .dropdown-menu { display: none; position: absolute; right: 24px; top: 70px; background: white; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 100; flex-direction: column; }
  .dropdown-menu.show { display: flex; }
  .dropdown-menu button { display: block; width: 100%; padding: 14px 24px; text-align: left; background: none; border: none; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; color: var(--ink); cursor: pointer; border-bottom: 1px solid var(--line); transition: background 0.2s; }
  .dropdown-menu button:hover { background: #FAFAFA; }
  .dropdown-menu button:last-child { border-bottom: none; color: var(--danger); }

  .chat-area { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; max-width: 800px; margin: 0 auto; width: 100%; }
  .system-message { text-align: center; margin-bottom: 24px; }
  .system-badge { display: inline-block; background: rgba(255,255,255,0.7); border: 1px solid var(--line); padding: 8px 16px; border-radius: 999px; font-size: 13px; color: var(--muted); }
  .system-badge strong { color: var(--purple); }

  .bubble { max-width: 75%; padding: 14px 18px; border-radius: 20px; font-size: 15px; line-height: 1.5; position: relative; }
  .bubble.them { background: white; border: 1px solid var(--line); color: var(--ink); align-self: flex-start; border-bottom-left-radius: 4px; }
  .bubble.you { background: var(--purple); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
  .bubble-time { font-size: 11px; margin-top: 6px; display: block; opacity: 0.7; text-align: right; }

  .chat-input-area { background: rgba(255,255,255,0.9); border-top: 1px solid var(--line); padding: 16px 24px; }
  .input-container { max-width: 800px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
  .chat-input { flex: 1; padding: 14px 20px; border: 1px solid var(--line); border-radius: 999px; font-family: 'Inter', sans-serif; font-size: 15px; background: white; outline: none; }
  .chat-input:focus { border-color: var(--purple); }
  .send-btn { background: var(--purple); color: white; border: none; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .send-btn svg { width: 20px; height: 20px; margin-left: -2px; }

  .bottom-safety-link { text-align: center; margin-top: 8px; }
  .bottom-safety-link button { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div class="chat-header">
  <div class="header-left">
    <a href="inbox.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>
    <div class="header-info">
      <h2>🔒 Private Conversation</h2>
      <p>Only you two can see this</p>
    </div>
  </div>

  <button class="options-btn" id="options-btn" onclick="toggleMenu(event)">
    🛡️ Safety
  </button>

  <div class="dropdown-menu" id="dropdown-menu">
    <button onclick="reportChat()">🚩 Report this chat</button>
    <button onclick="blockChat()">🚫 Block this user</button>
  </div>
</div>

<div class="chat-area" id="chat-area">
  <div class="system-message">
    <div class="system-badge" id="post-context">Loading original message...</div>
  </div>
</div>

<div class="chat-input-area">
  <form class="input-container" id="chat-form">
    <input type="text" id="message-input" class="chat-input" placeholder="Write privately..." required autocomplete="off">
    <button type="submit" class="send-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </form>
  
  <div class="bottom-safety-link">
    <button onclick="toggleMenu(event)">Report or Block this user</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = 'https://gwirenkzjelndztpgjfk.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3aXJlbmt6amVsbmR6dHBnamZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0OTk3MjMsImV4cCI6MjExMDA3NTcyM30.ijyo2hp4TWgh_QW0wft4FHZwfxk4XQgAANYZgBOUds4'; // <-- MAKE SURE KEY IS HERE
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  let currentUser = null;
  let currentThreadId = null;
  let currentPostId = null;

  const chatArea = document.getElementById('chat-area');
  const postContext = document.getElementById('post-context');

  function toggleMenu(event) {
    event.stopPropagation();
    document.getElementById('dropdown-menu').classList.toggle('show');
  }

  window.onclick = function(event) {
    if (!event.target.matches('.options-btn') && !event.target.matches('.bottom-safety-link button')) {
      const dropdown = document.getElementById('dropdown-menu');
      if (dropdown.classList.contains('show')) {
        dropdown.classList.remove('show');
      }
    }
  }

  async function reportChat() {
    const confirmReport = confirm("Are you sure you want to report this conversation? Our safety team will review it.");
    if (!confirmReport) return;

    const { data: thread } = await supabaseClient.from('threads').select('author_id, replier_id').eq('id', currentThreadId).single();

    if (thread) {
      const otherUserId = thread.author_id === currentUser.id ? thread.replier_id : thread.author_id;

      const { error } = await supabaseClient.from('reports').insert([{
        reporter_id: currentUser.id,
        reported_user_id: otherUserId,
        thread_id: currentThreadId,
        reason: 'User reported from chat'
      }]);

      if (error) {
        alert('Error submitting report: ' + error.message);
      } else {
        alert('Thank you. This conversation has been reported to the safety team.');
      }
    }
    document.getElementById('dropdown-menu').classList.remove('show');
  }

   async function blockChat() {
    const confirmBlock = confirm("Are you sure you want to block this user? They will no longer be able to contact you, and this chat will be removed from your inbox.");
    if (!confirmBlock) return;

    // 1. Find out who the other person is
    const { data: thread } = await supabaseClient.from('threads').select('author_id, replier_id').eq('id', currentThreadId).single();

    if (thread) {
      const otherUserId = thread.author_id === currentUser.id ? thread.replier_id : thread.author_id;

      // 2. Insert into blocks table
      const { error } = await supabaseClient
        .from('blocks')
        .insert([{
          blocker_id: currentUser.id,
          blocked_id: otherUserId
        }]);

      if (error) {
        alert('Error blocking user: ' + error.message);
      } else {
        alert('User blocked successfully.');
        window.location.href = 'inbox.html'; // Send them back to the inbox
      }
    }
  }

  async function initChat() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) { window.location.href = 'auth.html?mode=login'; return; }
    currentUser = user;

    const urlParams = new URLSearchParams(window.location.search);
    currentPostId = urlParams.get('post_id');
    const threadIdParam = urlParams.get('thread_id');

    if (threadIdParam) {
      currentThreadId = threadIdParam;
      await loadThreadData();
    } else if (currentPostId) {
      await startOrLoadThread();
    } else {
      window.location.href = 'inbox.html';
      return;
    }

    await loadMessages();

    supabaseClient.channel('custom-all-channel')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `thread_id=eq.${currentThreadId}` }, payload => {
        if (payload.new.sender_id !== currentUser.id) {
          appendMessage(payload.new);
        }
      })
      .subscribe();
  }

  async function startOrLoadThread() {
    const { data: post } = await supabaseClient.from('posts').select('*').eq('id', currentPostId).single();
    if (post) { postContext.innerHTML = `Replying to: <strong>${post.category}</strong> · "${post.content.substring(0, 40)}..."`; }

    const { data: existingThread } = await supabaseClient.from('threads').select('id').eq('post_id', currentPostId).eq('replier_id', currentUser.id).single();

    if (existingThread) {
      currentThreadId = existingThread.id;
    } else {
      const { data: postData } = await supabaseClient.from('posts').select('user_id').eq('id', currentPostId).single();
      const { data: newThread, error } = await supabaseClient.from('threads').insert([{
        post_id: currentPostId,
        author_id: postData.user_id,
        replier_id: currentUser.id
      }]).select().single();

      if (error) { alert('Error starting chat: ' + error.message); return; }
      currentThreadId = newThread.id;
    }
  }

  async function loadThreadData() {
    const { data: thread } = await supabaseClient.from('threads').select('post_id, author_id, replier_id').eq('id', currentThreadId).single();
    if (thread) {
       // 1. Mark as read based on who we are
       const isAuthor = thread.author_id === currentUser.id;
       if (isAuthor) {
         await supabaseClient.from('threads').update({ unread_author: false }).eq('id', currentThreadId);
       } else {
         await supabaseClient.from('threads').update({ unread_replier: false }).eq('id', currentThreadId);
       }

       // 2. Load the context badge
       const { data: post } = await supabaseClient.from('posts').select('*').eq('id', thread.post_id).single();
       if (post) { postContext.innerHTML = `Replying to: <strong>${post.category}</strong> · "${post.content.substring(0, 40)}..."`; }
    }
  }

  async function loadMessages() {
    const { data: messages, error } = await supabaseClient.from('messages').select('*').eq('thread_id', currentThreadId).order('created_at', { ascending: true });
    if (error) { console.error(error); return; }
    
    document.querySelectorAll('.bubble').forEach(el => el.remove());
    messages.forEach(msg => appendMessage(msg));
  }

  function appendMessage(msg) {
    const isMe = msg.sender_id === currentUser.id;
    const bubble = document.createElement('div');
    bubble.className = `bubble ${isMe ? 'you' : 'them'}`;
    
    const dateObj = new Date(msg.created_at);
    const formattedDate = dateObj.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

    bubble.innerHTML = `
      ${msg.content}
      <span class="bubble-time">${formattedDate}</span>
    `;
    chatArea.appendChild(bubble);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  document.getElementById('chat-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('message-input');
    const content = input.value.trim();
    if (!content) return;

    input.value = '';

    const { data, error } = await supabaseClient.from('messages').insert([{
      thread_id: currentThreadId,
      sender_id: currentUser.id,
      content: content
    }]).select().single();

    if (error) {
      alert('Error sending message: ' + error.message);
    } else {
      appendMessage(data);
    }
  });

  initChat();
</script>
</body>
</html>
