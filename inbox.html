
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>8mellow — Inbox</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --purple:#5B32A5; --light-purple:#F3ECFC; --mint:#7FFFD4; --dark-gold:#B8860B; --ink:#1A1A1A; --muted:#666666; --line:#EAEAEA; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background: radial-gradient(circle at 20% 10%, #FFF5F5 0%, transparent 40%), radial-gradient(circle at 80% 90%, #FFF9F0 0%, transparent 40%), radial-gradient(circle at 50% 50%, #F9F5FF 0%, transparent 60%), #FAF7F2; color:var(--ink); font-family:'Inter', sans-serif; line-height:1.6; min-height: 100vh; padding: 40px 20px; }
  .inbox-container { width: 100%; max-width: 800px; margin: 0 auto; background: white; border-radius: 24px; padding: 48px; box-shadow: 0 20px 60px rgba(91,50,165,0.06); position: relative; overflow: hidden; }
  .inbox-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, var(--purple), var(--mint)); }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
  .logo { font-family:'Outfit',sans-serif; font-size: 24px; font-weight:700; color:var(--dark-gold); padding-bottom: 2px; border-bottom: 4px solid var(--mint); display: inline-block; }
  .back-btn { color: var(--muted); text-decoration: none; font-size: 15px; font-weight: 500; transition: color 0.2s; }
  .back-btn:hover { color: var(--ink); }
  
  h1 { font-family: 'Outfit', sans-serif; font-size: 32px; color: var(--purple); margin-bottom: 24px; font-weight: 700; }
  
  .section-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; margin-top: 32px; }
  .section-label:first-of-type { margin-top: 0; }

  .chat-row { display: flex; align-items: center; gap: 16px; padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: #FAFAFA; margin-bottom: 12px; text-decoration: none; color: inherit; transition: all 0.2s; }
  .chat-row:hover { border-color: var(--purple); background: white; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(91,50,165,0.05); }
  .chat-icon { font-size: 24px; width: 48px; height: 48px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid var(--line); }
  .chat-details { flex: 1; min-width: 0; }
  .chat-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  
  /* Updated Preview to hold Date */
  .chat-preview { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.chat-date-side {
  font-size: 12px;
  font-weight: 600;
  color: var(--dark-gold);
  white-space: nowrap;
}
  .chat-date { color: var(--dark-gold); font-weight: 500; }
  
  .empty-text { font-size: 14px; color: var(--muted); font-style: italic; padding: 10px 0; }

  .unread-dot {
    width: 10px;
    height: 10px;
    background: var(--purple);
    border-radius: 50%;
    box-shadow: 0 0 0 3px var(--light-purple);
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="inbox-container">
  <div class="header">
    <div class="logo">8mellow</div>
    <a href="dashboard.html" class="back-btn">← Dashboard</a>
  </div>
  
  <h1>Inbox</h1>

  <div class="section-label">Chats from my messages</div>
  <div id="author-chats">
    <p class="empty-text">Loading...</p>
  </div>

  <div class="section-label">Chats I started</div>
  <div id="replier-chats">
    <p class="empty-text">Loading...</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = 'https://gwirenkzjelndztpgjfk.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3aXJlbmt6amVsbmR6dHBnamZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0OTk3MjMsImV4cCI6MjExMDA3NTcyM30.ijyo2hp4TWgh_QW0wft4FHZwfxk4XQgAANYZgBOUds4'; // <-- MAKE SURE KEY IS HERE
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  async function loadInbox() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) { window.location.href = 'auth.html?mode=login'; return; }

    const authorContainer = document.getElementById('author-chats');
    const replierContainer = document.getElementById('replier-chats');

    // 1. Fetch the users I have blocked
    const { data: blocks } = await supabaseClient
      .from('blocks')
      .select('blocked_id')
      .eq('blocker_id', user.id);
      
    const blockedUserIds = blocks ? blocks.map(b => b.blocked_id) : [];

    // 2. Fetch threads
    const { data: threads, error } = await supabaseClient
      .from('threads')
      .select(`
        id,
        author_id,
        replier_id,
        created_at,
        unread_author,
        unread_replier,
        posts ( category, content )
      `)
      .or(`author_id.eq.${user.id},replier_id.eq.${user.id}`)
      .order('created_at', { ascending: false }); // Newest chats at the top

    if (error) {
      authorContainer.innerHTML = '<p class="empty-text">Error loading chats.</p>';
      console.error(error);
      return;
    }

    // Filter out threads where the other person is blocked
    const safeThreads = threads.filter(t => {
      const otherUserId = t.author_id === user.id ? t.replier_id : t.author_id;
      return !blockedUserIds.includes(otherUserId);
    });

    const chatsFromMyMessages = safeThreads.filter(t => t.author_id === user.id);
    const chatsIStarted = safeThreads.filter(t => t.replier_id === user.id);

    function renderChatList(container, chatArray, isAuthorView) {
      if (chatArray.length === 0) {
        container.innerHTML = '<p class="empty-text">No chats here yet.</p>';
        return;
      }
      
      container.innerHTML = chatArray.map(thread => {
        const formattedDate = timeAgo(thread.created_at);

        // Check if the thread is unread for the current user
        const isUnread = isAuthorView ? thread.unread_author : thread.unread_replier;

        return `
        <a href="chat.html?thread_id=${thread.id}" class="chat-row">
          <div class="chat-icon">💬</div>
          <div class="chat-details">
            <div class="chat-title">Re: "${thread.posts.content.substring(0, 45)}..."</div>
            <div class="chat-preview">
              <span>${thread.posts.category}</span>
            </div>
          </div>
          ${isUnread ? '<div class="unread-dot"></div>' : ''}
          <div class="chat-date-side">${formattedDate}</div>
        </a>
      `}).join('');
    }

    // Call the function with the correct role
    renderChatList(authorContainer, chatsFromMyMessages, true);
    renderChatList(replierContainer, chatsIStarted, false);
  }
  function timeAgo(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const diffMs = now - date;
    
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);

    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return `${diffMins} min${diffMins > 1 ? 's' : ''} ago`;
    if (diffHours < 24) return `${diffHours} hr${diffHours > 1 ? 's' : ''} ago`;
    if (diffDays < 7) return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;

    // Older than 7 days
    return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  loadInbox();
</script>
</body>
</html>
