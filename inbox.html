
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>8mellow — Inbox</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#5B32A5">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --purple:#5B32A5; --light-purple:#F3ECFC; --mint:#7FFFD4; --dark-gold:#B8860B; --ink:#1A1A1A; --muted:#666666; --line:#EAEAEA; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background: radial-gradient(circle at 20% 10%, #FFF5F5 0%, transparent 40%), radial-gradient(circle at 80% 90%, #FFF9F0 0%, transparent 40%), radial-gradient(circle at 50% 50%, #F9F5FF 0%, transparent 60%), #FAF7F2; color:var(--ink); font-family:'Inter', sans-serif; line-height:1.6; min-height: 100vh; padding: 40px 20px; }
  .inbox-container { width: 100%; max-width: 800px; margin: 0 auto; background: white; border-radius: 24px; padding: 48px; box-shadow: 0 20px 60px rgba(91,50,165,0.06); position: relative; overflow: hidden; }
  .inbox-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, var(--purple), var(--mint)); }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
  .logo { font-family:'Outfit',sans-serif; font-size: 24px; font-weight:700; color:var(--dark-gold); padding-bottom: 2px; border-bottom: 4px solid var(--mint); display: inline-block; }
  .back-btn { color: var(--muted); text-decoration: none; font-size: 15px; font-weight: 500; transition: color 0.2s; }
  .back-btn:hover { color: var(--ink); }
  
  h1 { font-family: 'Outfit', sans-serif; font-size: 32px; color: var(--purple); margin-bottom: 24px; font-weight: 700; }
  
  .section-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; margin-top: 32px; }
  .section-label:first-of-type { margin-top: 0; }

  .chat-row { display: flex; align-items: center; gap: 16px; padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: #FAFAFA; margin-bottom: 12px; text-decoration: none; color: inherit; transition: all 0.2s; }
  .chat-row:hover { border-color: var(--purple); background: white; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(91,50,165,0.05); }
  .chat-icon { font-size: 24px; width: 48px; height: 48px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid var(--line); }
  .chat-details { flex: 1; min-width: 0; }
  .chat-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  
  /* Updated Preview to hold Date */
  .chat-preview { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.chat-date-side {
  font-size: 12px;
  font-weight: 600;
  color: #8A6508;
  white-space: nowrap;
}
  .chat-date { color: #8A6508; font-weight: 500; }
  
  /* Loading skeletons */
  .skel{ background:linear-gradient(90deg,#EFEAF5 25%,#F9F6FD 50%,#EFEAF5 75%); background-size:200% 100%; animation:shimmer 1.4s linear infinite; border-radius:8px; }
  @keyframes shimmer{ 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }
  @media (prefers-reduced-motion: reduce){ .skel{ animation:none; } }
  .skel-row{ display:flex; align-items:center; gap:16px; padding:20px; border:1px solid var(--line); border-radius:16px; background:#FAFAFA; margin-bottom:12px; }
  .skel-circle{ width:48px; height:48px; border-radius:50%; flex-shrink:0; }
  .skel-body{ flex:1; }
  /* Empty states */
  .empty-card{ text-align:center; padding:48px 20px; }
  .empty-card svg{ width:170px; height:auto; margin-bottom:20px; animation:floaty 5s ease-in-out infinite; }
  .empty-card.small{ padding:32px 20px; }
  .empty-card.small svg{ width:120px; }
  .empty-card h3{ font-family:'Outfit',sans-serif; font-size:22px; color:var(--purple); margin-bottom:8px; }
  .empty-card p{ color:var(--muted); font-size:15px; max-width:340px; margin:0 auto 24px; }
  .empty-btn{ display:inline-block; background:var(--purple); color:white; border:none; padding:14px 28px; border-radius:999px; font-family:'Outfit',sans-serif; font-size:15px; font-weight:600; text-decoration:none; cursor:pointer; transition:all .2s; }
  .empty-btn:hover{ background:#482680; transform:translateY(-1px); }
  @keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  @media (prefers-reduced-motion: reduce){ .empty-card svg{ animation:none; } }
  .chat-delete { background:none; border:none; cursor:pointer; font-size:16px; padding:8px; border-radius:8px; opacity:.45; flex-shrink:0; transition:all .2s; }
  .chat-delete:hover { opacity:1; background:#FFF5F5; }
  .empty-text { font-size: 14px; color: var(--muted); font-style: italic; padding: 10px 0; }

  .unread-dot {
    width: 10px;
    height: 10px;
    background: var(--purple);
    border-radius: 50%;
    box-shadow: 0 0 0 3px var(--light-purple);
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="inbox-container">
  <div class="header">
    <div class="logo">8mellow</div>
    <a href="dashboard.html" class="back-btn">← Dashboard</a>
  </div>
  
  <h1>Inbox</h1>

  <div class="section-label">Chats from my messages</div>
  <div id="author-chats">
    <div class="skel-row" aria-hidden="true">
      <div class="skel skel-circle"></div>
      <div class="skel-body">
        <div class="skel" style="height:15px;width:75%;margin-bottom:10px"></div>
        <div class="skel" style="height:12px;width:35%"></div>
      </div>
      <div class="skel" style="height:12px;width:60px"></div>
    </div>
    <div class="skel-row" aria-hidden="true">
      <div class="skel skel-circle"></div>
      <div class="skel-body">
        <div class="skel" style="height:15px;width:75%;margin-bottom:10px"></div>
        <div class="skel" style="height:12px;width:35%"></div>
      </div>
      <div class="skel" style="height:12px;width:60px"></div>
    </div>
  </div>

  <div class="section-label">Chats I started</div>
  <div id="replier-chats">
    <div class="skel-row" aria-hidden="true">
      <div class="skel skel-circle"></div>
      <div class="skel-body">
        <div class="skel" style="height:15px;width:75%;margin-bottom:10px"></div>
        <div class="skel" style="height:12px;width:35%"></div>
      </div>
      <div class="skel" style="height:12px;width:60px"></div>
    </div>
    <div class="skel-row" aria-hidden="true">
      <div class="skel skel-circle"></div>
      <div class="skel-body">
        <div class="skel" style="height:15px;width:75%;margin-bottom:10px"></div>
        <div class="skel" style="height:12px;width:35%"></div>
      </div>
      <div class="skel" style="height:12px;width:60px"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = 'https://gwirenkzjelndztpgjfk.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3aXJlbmt6amVsbmR6dHBnamZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0OTk3MjMsImV4cCI6MjExMDA3NTcyM30.ijyo2hp4TWgh_QW0wft4FHZwfxk4XQgAANYZgBOUds4'; // <-- MAKE SURE KEY IS HERE
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  // Makes text safe to place inside HTML (stops pasted code from running)
  function esc(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  const BASE_TITLE = document.title.replace(/^\(\d+\)\s*/, '');
  function setUnreadTitle(n) { document.title = (n > 0 ? '(' + n + ') ' : '') + BASE_TITLE; }

  // Live updates: realtime changes, plus a gentle check every 45 seconds and when the tab is opened again
  function watchInbox(user, onChange) {
    let t = null;
    const fire = () => { clearTimeout(t); t = setTimeout(onChange, 400); };
    try {
      supabaseClient.channel('inbox-live-' + user.id)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'threads', filter: 'author_id=eq.' + user.id }, fire)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'threads', filter: 'replier_id=eq.' + user.id }, fire)
        .subscribe();
    } catch (e) { /* the timer below still keeps things fresh */ }
    setInterval(() => { if (!document.hidden) onChange(); }, 45000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) onChange(); });
  }

  async function loadInbox() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) { window.location.href = 'auth.html?mode=login&next=' + encodeURIComponent(location.pathname.split('/').pop() + location.search); return; }

    const authorContainer = document.getElementById('author-chats');
    const replierContainer = document.getElementById('replier-chats');

    // 1. Fetch the users I have blocked
    const { data: blocks } = await supabaseClient
      .from('blocks')
      .select('blocked_id')
      .eq('blocker_id', user.id);
      
    const blockedUserIds = blocks ? blocks.map(b => b.blocked_id) : [];

    // 2. Fetch threads
    const { data: threads, error } = await supabaseClient
      .from('threads')
      .select(`
        id,
        author_id,
        replier_id,
        created_at,
        unread_author,
        unread_replier,
        deleted_by_author,
        deleted_by_replier,
        posts ( category, content )
      `)
      .or(`author_id.eq.${user.id},replier_id.eq.${user.id}`)
      .order('created_at', { ascending: false }); // Newest chats at the top

    if (error) {
      authorContainer.innerHTML = '<p class="empty-text">Error loading chats.</p>';
      console.error(error);
      return;
    }

    // Filter out threads where the other person is blocked
    const safeThreads = threads.filter(t => {
      const otherUserId = t.author_id === user.id ? t.replier_id : t.author_id;
      return !blockedUserIds.includes(otherUserId);
    });

    const chatsFromMyMessages = safeThreads.filter(t => t.author_id === user.id && !t.deleted_by_author);
    const chatsIStarted = safeThreads.filter(t => t.replier_id === user.id && !t.deleted_by_replier);

    // Nothing at all: show one friendly empty state instead of two small ones
    if (chatsFromMyMessages.length === 0 && chatsIStarted.length === 0) {
      const ART_ENVELOPE = `<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="100" cy="148" rx="56" ry="5" fill="#5B32A5" opacity=".08"/><rect x="56" y="34" width="88" height="66" rx="6" fill="white" stroke="#5B32A5" stroke-width="2.5"/><path d="M70 54h60M70 66h40" stroke="#5B32A5" stroke-width="3" stroke-linecap="round" opacity=".25"/><path d="M38 74L100 114L162 74V126a10 10 0 0 1-10 10H48a10 10 0 0 1-10-10Z" fill="#F3ECFC" stroke="#5B32A5" stroke-width="3" stroke-linejoin="round"/><path d="M38 74L100 114L162 74" stroke="#5B32A5" stroke-width="3" stroke-linejoin="round"/><circle cx="172" cy="40" r="5" fill="#7FFFD4"/><circle cx="26" cy="110" r="4" fill="#7FFFD4"/><path d="M28 40v10M23 45h10" stroke="#B8860B" stroke-width="2.5" stroke-linecap="round"/></svg>`;
      setUnreadTitle(0);
      document.querySelectorAll('.section-label').forEach(el => el.style.display = 'none');
      replierContainer.innerHTML = '';
      authorContainer.innerHTML = `<div class="empty-card">${ART_ENVELOPE}<h3>No conversations yet</h3><p>When someone replies to a message, it will appear here.</p><a class="empty-btn" href="index.html">Explore the Wall</a></div>`;
      return;
    }

    function renderChatList(container, chatArray, isAuthorView) {
      if (chatArray.length === 0) {
        container.innerHTML = '<p class="empty-text">No chats here yet.</p>';
        return;
      }
      
      container.innerHTML = chatArray.map(thread => {
        const formattedDate = timeAgo(thread.created_at);

        // Check if the thread is unread for the current user
        const isUnread = isAuthorView ? thread.unread_author : thread.unread_replier;

        return `
        <a href="chat.html?thread_id=${thread.id}" class="chat-row">
          <div class="chat-icon">💬</div>
          <div class="chat-details">
            <div class="chat-title">${thread.posts ? 'Re: "' + esc(thread.posts.content.substring(0, 45)) + '..."' : 'Original message was deleted'}</div>
            <div class="chat-preview">
              <span>${thread.posts ? esc(thread.posts.category) : 'Private conversation'}</span>
            </div>
          </div>
          ${isUnread ? '<div class="unread-dot"></div>' : ''}
          <div class="chat-date-side">${formattedDate}</div>
          <button type="button" class="chat-delete" title="Delete conversation" aria-label="Delete conversation" onclick="deleteChat(event, '${thread.id}', ${isAuthorView})">🗑️</button>
        </a>
      `}).join('');
    }

    setUnreadTitle(
      chatsFromMyMessages.filter(t => t.unread_author).length +
      chatsIStarted.filter(t => t.unread_replier).length
    );

    // Call the function with the correct role
    renderChatList(authorContainer, chatsFromMyMessages, true);
    renderChatList(replierContainer, chatsIStarted, false);
  }
  // "Delete for me": hides the chat from MY inbox only. The other person keeps their copy.
  async function deleteChat(event, threadId, isAuthorView) {
    event.preventDefault();
    event.stopPropagation();

    if (!confirm('Delete this conversation?\n\nIt will be removed from your inbox. The other person keeps their copy.')) return;

    const column = isAuthorView ? 'deleted_by_author' : 'deleted_by_replier';
    const { data, error } = await supabaseClient
      .from('threads')
      .update({ [column]: true })
      .eq('id', threadId)
      .select('id');

    if (error || !data || data.length === 0) {
      alert('Could not delete this conversation' + (error ? ': ' + error.message : '.'));
      return;
    }
    loadInbox();
  }

  function timeAgo(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const diffMs = now - date;
    
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);

    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return `${diffMins} min${diffMins > 1 ? 's' : ''} ago`;
    if (diffHours < 24) return `${diffHours} hr${diffHours > 1 ? 's' : ''} ago`;
    if (diffDays < 7) return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;

    // Older than 7 days
    return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  loadInbox();
  supabaseClient.auth.getUser().then(({ data: { user } }) => { if (user) watchInbox(user, loadInbox); });
</script>
<script src="idle-timeout.js"></script>
</body>
</html>
